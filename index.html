<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Portal de Reservas - Escuela 790</title>
  <link rel="icon" href="https://img.icons8.com/color/96/school.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      border: 1px solid #e2e8f0;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-manual {
      display: inline-block;
      text-decoration: none;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      transition: all 0.2s ease;
    }
    .btn-manual:hover {
      background-color: #1e293b;
      transform: translateY(-1px);
    }
    .footer-note {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Portal Educativo Oficial</div>
    <h1>Escuela Provincial N° 790</h1>
    <p>Conectando de forma segura con el Sistema de Gestión de Recursos y Reservas...</p>
    
    <div class="spinner" id="spinner"></div>

    <div>
      <a href="https://sistema-reservas-790-7288212040.us-central1.run.app" id="link-directo" class="btn-manual">
        Ingresar al Sistema
      </a>
    </div>

    <div class="footer-note">
      Área de Informática • Puerto Madryn
    </div>
  </div>

  <script>
    // Configuración de Servidores
    const PRIMARY_SERVER = "https://sistema-reservas-790-7288212040.us-central1.run.app";
    const BACKUP_SERVER = "https://sistema-reservas-790.onrender.com";
    const TIMEOUT_MS = 2500; // 2.5 segundos de tolerancia máxima

    function redireccionar(url) {
      window.location.replace(url);
    }

    // Intentar verificar Cloud Run de forma silenciosa
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(PRIMARY_SERVER + "/api/health", { 
      method: "GET", 
      mode: "no-cors", 
      signal: controller.signal 
    })
    .then(() => {
      clearTimeout(timeoutId);
      redireccionar(PRIMARY_SERVER);
    })
    .catch((err) => {
      // Si Cloud Run falla o se agota el tiempo, deriva al servidor de respaldo (Render)
      console.warn("Derivando a servidor de respaldo...");
      redireccionar(BACKUP_SERVER);
    });

    // Fallback absoluto de seguridad a los 3 segundos
    setTimeout(() => {
      redireccionar(PRIMARY_SERVER);
    }, 3000);
  </script>
</body>
</html>
